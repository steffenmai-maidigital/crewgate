; PHP-Einstellungen im Container (Standard 04 und 06)
; PHP settings in the container (standards 04 and 06)

; Keine PHP-Version in den Antwort-Kopfzeilen
; No PHP version in the response headers
expose_php = Off

; Keine Funktionsargumente in Stacktraces: Sonst stehen z. B. Passwörter einer
; fehlgeschlagenen Verzeichnis-Anmeldung im Protokoll
; No function arguments in stack traces: otherwise e.g. passwords of a failed
; directory sign-in end up in the log
zend.exception_ignore_args = On

; Fehler ins Protokoll, nie auf die Seite
; Errors go to the log, never to the page
display_errors = Off
display_startup_errors = Off
log_errors = On

; Speicher für den Audit-Bericht als PDF (enthält das ganze Protokoll; mit 128 MB
; brach er bei großen Protokollen ab)
; Memory for the audit report as PDF (contains the whole log; with 128 MB it
; aborted for large logs)
memory_limit = 256M
